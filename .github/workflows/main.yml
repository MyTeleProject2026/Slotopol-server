name: Slotopol Server CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Test API and utilities
        run: go test -v ./util ./api

      - name: Build server
        run: go build -v .
