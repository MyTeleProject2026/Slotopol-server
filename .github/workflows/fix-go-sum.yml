name: Generate and Commit go.sum

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate go.sum
        run: go mod tidy

      - name: Commit and push go.sum
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add go.sum
          git commit -m "Add missing go.sum" || echo "No changes to commit"
          git push
