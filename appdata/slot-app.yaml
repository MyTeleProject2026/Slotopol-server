# ============================================================
# Slotopol Server Configuration
# ============================================================

authentication:
  access-ttl: ${SLOTOPOL_ACCESS_TTL:-24h}
  refresh-ttl: ${SLOTOPOL_REFRESH_TTL:-72h}
  access-key: ${SLOTOPOL_ACCESS_KEY}
  refresh-key: ${SLOTOPOL_REFRESH_KEY}
  nonce-timeout: 2m30s

activation:
  use-activation: false
  brevo-api-key: ${SLOTOPOL_BREVO_API_KEY:-}
  brevo-email-endpoint: https://api.brevo.com/v3/smtp/email
  sender-name: Slotopol Server
  sender-email: noreply@slotopol.com
  replyto-email: noreply@slotopol.com
  email-subject: Slotopol Verification Code
  email-html-content: |
    <html>
      <head></head>
      <body>
        <p>Your Slotopol verification code is: <b>%06d</b></p>
      </body>
    </html>
  code-timeout: 15m

web-server:
  trusted-proxies: 127.0.0.0/8
  port-http:
  - :${SLOTOPOL_PORT:-8080}
  read-timeout: 15s
  read-header-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  max-header-bytes: 1048576
  shutdown-timeout: 15s

database:
  driver-name: ${SLOTOPOL_DBDRIVER:-mysql}
  use-spin-log: true
  club-source-name: ${SLOTOPOL_CLUBDSN}
  spin-source-name: ${SLOTOPOL_SPINDSN}
  sql-flush-tick: 2500ms
  club-update-buffer: 200
  club-insert-buffer: 150
  spin-insert-buffer: 250

gameplay:
  adjunct-limit: 100000
  min-jackpot: 10000
  max-spin-attempts: 300

# ============================================================
# Cloudinary Configuration (NEW)
# ============================================================
cloudinary:
  cloud_name: ${SLOTOPOL_CLOUDINARY_CLOUD_NAME}
  api_key: ${SLOTOPOL_CLOUDINARY_API_KEY}
  api_secret: ${SLOTOPOL_CLOUDINARY_API_SECRET}
  upload_folder: ${SLOTOPOL_CLOUDINARY_UPLOAD_FOLDER:-slotopol}

# ============================================================
# Uploads Configuration (NEW)
# ============================================================
uploads:
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
    - image/svg+xml
  max_file_size: 5242880 # 5MB
  storage: cloudinary # local, cloudinary, both
