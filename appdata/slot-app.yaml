# ============================================================
# Slotopol Server Configuration
# ============================================================

authentication:
  # Access token time to live.
  access-ttl: ${ACCESS_TTL:-24h}
  # Refresh token time to live.
  refresh-ttl: ${REFRESH_TTL:-72h}
  # Key for access HS-256 JWT-tokens.
  access-key: ${ACCESS_KEY}
  # Key for refresh HS-256 JWT-tokens.
  refresh-key: ${REFRESH_KEY}
  # Validity timeout of the nonce with which the login hash is signed.
  nonce-timeout: 2m30s

activation:
  # Expects accounts activation by code after accounts registration.
  use-activation: false
  # Brevo API-key for email verification (optional).
  brevo-api-key: ${BREVO_API_KEY:-}
  brevo-email-endpoint: https://api.brevo.com/v3/smtp/email
  sender-name: Slotopol Server
  sender-email: noreply@slotopol.com
  replyto-email: noreply@slotopol.com
  email-subject: Slotopol Verification Code
  email-html-content: |
    <html>
      <head></head>
      <body>
        <p>Your Slotopol verification code is: <b>%06d</b></p>
      </body>
    </html>
  code-timeout: 15m

web-server:
  trusted-proxies: 127.0.0.0/8
  port-http:
  - :${SERVER_PORT:-8080}
  read-timeout: 15s
  read-header-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  max-header-bytes: 1048576
  shutdown-timeout: 15s

database:
  driver-name: ${DB_DRIVER:-mysql}
  use-spin-log: true
  club-source-name: ${DB_USER:-admin}:${DB_PASSWORD}@tcp(${DB_HOST:-localhost}:${DB_PORT:-3306})/${DB_NAME:-slotopol}
  spin-source-name: ${DB_USER:-admin}:${DB_PASSWORD}@tcp(${DB_HOST:-localhost}:${DB_PORT:-3306})/${DB_NAME:-slotopol}
  sql-flush-tick: 2500ms
  club-update-buffer: 200
  club-insert-buffer: 150
  spin-insert-buffer: 250

gameplay:
  adjunct-limit: 100000
  min-jackpot: 10000
  max-spin-attempts: 300

# ============================================================
# Cloudinary Configuration
# ============================================================
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}
  upload_folder: ${CLOUDINARY_UPLOAD_FOLDER:-slotopol}
  image_optimization:
    quality: auto
    fetch_format: auto
    width: 400
    height: 300
    crop: fill

# ============================================================
# Image Upload Configuration
# ============================================================
uploads:
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
    - image/svg+xml
  max_file_size: 5242880 # 5MB
  storage: cloudinary # Options: local, cloudinary, both
